<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./dangki.css" />
    <title>Đăng ký</title>
  </head>
  <body>
    <div class="scene">
      <div class="beam"></div>
      <a href="./index.html" class="back-link">&larr; Về trang chủ</a>

      <main class="auth-card">
        <p class="eyebrow">Gia nhập ngay hôm nay</p>
        <h1>Đăng ký</h1>
        <p class="subtitle">
          Tạo tài khoản để bắt đầu đặt vé xem phim yêu thích của bạn.
        </p>

        <form id="registerForm">
          <label class="field">
            <span class="field-label">Họ và tên</span>
            <input
              type="text"
              name="fullname"
              placeholder="Nguyễn Văn A"
              required
            />
          </label>

          <label class="field">
            <span class="field-label">Số điện thoại</span>
            <input
              type="text"
              name="account"
              placeholder="0123456789"
              required
            />
          </label>

          <label class="field">
            <span class="field-label">Mật khẩu</span>
            <div class="password-wrap">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Tạo mật khẩu"
                minlength="6"
                required
              />
              <button
                type="button"
                class="toggle-pass"
                id="togglePass"
                aria-label="Hiện mật khẩu"
              >
                Hiện
              </button>
            </div>
          </label>

          <label class="field">
            <span class="field-label">Xác nhận mật khẩu</span>
            <div class="password-wrap">
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Nhập lại mật khẩu"
                minlength="6"
                required
              />
              <button
                type="button"
                class="toggle-pass"
                id="toggleConfirmPass"
                aria-label="Hiện mật khẩu"
              >
                Hiện
              </button>
            </div>
            <span class="field-error" id="matchError"></span>
          </label>

          <div class="form-row form-row-single">
            <label class="remember">
              <input type="checkbox" name="agree" required />
              <span
                >Tôi đồng ý với
                <a href="./dieukhoan.html" class="forgot"
                  >Điều khoản sử dụng</a
                ></span
              >
            </label>
          </div>

          <button type="submit" class="btn-primary">Tạo tài khoản</button>
        </form>

        <div class="divider"><span>hoặc</span></div>

        <a href="https://mail.google.com/mail/"
          ><button type="button" class="btn-google">
            <svg
              width="18"
              height="18"
              viewBox="0 0 18 18"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill="#4285F4"
                d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.92c1.7-1.57 2.68-3.88 2.68-6.64z"
              />
              <path
                fill="#34A853"
                d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.95v2.33C2.44 15.98 5.48 18 9 18z"
              />
              <path
                fill="#FBBC05"
                d="M3.97 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.96H.95A8.996 8.996 0 0 0 0 9c0 1.45.35 2.83.95 4.04l3.02-2.33z"
              />
              <path
                fill="#EA4335"
                d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.95 4.96l3.02 2.33C4.68 5.16 6.66 3.58 9 3.58z"
              />
            </svg>
            Đăng ký với Google
          </button></a
        >

        <p class="switch">
          Đã có tài khoản? <a href="./indexdangnhap.html">Đăng nhập</a>
        </p>
      </main>
    </div>
    <script src="./dangki.js"></script>
  </body>
</html>
