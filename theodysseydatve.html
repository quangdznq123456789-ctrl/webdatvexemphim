<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" href="/THE ODYSSEY.jpg" />
    <link rel="stylesheet" href="datvenghihesonghihuu.css" />

    <title>Đặt vé -THE ODYSSEY</title>
  </head>

  <body>
    <header class="header">
      <a href="/theodyssey.html" class="back"> ← Quay lại </a>

      <h3>ĐẶT VÉ XEM PHIM</h3>
    </header>

    <main class="container booking-container">
      <section class="movie-info">
        <img src="/THE ODYSSEY.jpg" alt="THE ODYSSEY" />

        <div class="movie-text">
          <h2>THE ODYSSEY</h2>

          <p><b>Thể loại:</b> Hành Động, Thần thoại</p>

          <p><b>Thời lượng:</b> 173 phút</p>

          <p><b>Rated:</b> T16</p>
        </div>
      </section>

      <section class="booking-section">
        <h4>1. Chọn ngày</h4>

        <div class="date-list">
          <button class="date active">
            <span>Hôm nay</span>
            <strong>21/08</strong>
          </button>

          <button class="date">
            <span>Thứ 7</span>
            <strong>22/08</strong>
          </button>

          <button class="date">
            <span>Chủ nhật</span>
            <strong>23/08</strong>
          </button>

          <button class="date">
            <span>Thứ 2</span>
            <strong>24/08</strong>
          </button>

          <button class="date">
            <span>Thứ 3</span>
            <strong>25/08</strong>
          </button>
        </div>
      </section>

      <section class="booking-section">
        <h4>2. Chọn giờ chiếu</h4>

        <div class="time-list">
          <button class="time">09:30</button>

          <button class="time">11:45</button>

          <button class="time">14:00</button>

          <button class="time">16:30</button>

          <button class="time">19:00</button>

          <button class="time">21:30</button>
        </div>
      </section>

      <section class="booking-section">
        <h4>3. Chọn ghế</h4>

        <div class="screen">MÀN HÌNH</div>

        <div class="seat-note">
          <div>
            <span class="box normal"></span>
            Ghế thường
          </div>

          <div>
            <span class="box selected"></span>
            Đang chọn
          </div>

          <div>
            <span class="box booked"></span>
            Đã đặt
          </div>
        </div>

        <div class="seats-container">
          <div class="seat-row">
            <span class="row-name">A</span>

            <button class="seat">A1</button>
            <button class="seat">A2</button>
            <button class="seat">A3</button>
            <button class="seat">A4</button>
            <button class="seat">A5</button>

            <div class="walkway"></div>

            <button class="seat">A6</button>
            <button class="seat">A7</button>
            <button class="seat">A8</button>
            <button class="seat">A9</button>
            <button class="seat">A10</button>
          </div>

          <!-- HÀNG B -->
          <div class="seat-row">
            <span class="row-name">B</span>

            <button class="seat">B1</button>
            <button class="seat">B2</button>
            <button class="seat">B3</button>
            <button class="seat">B4</button>
            <button class="seat">B5</button>

            <div class="walkway"></div>

            <button class="seat">B6</button>
            <button class="seat">B7</button>
            <button class="seat">B8</button>
            <button class="seat">B9</button>
            <button class="seat">B10</button>
          </div>

          <!-- HÀNG C -->
          <div class="seat-row">
            <span class="row-name">C</span>

            <button class="seat">C1</button>
            <button class="seat">C2</button>
            <button class="seat">C3</button>
            <button class="seat">C4</button>
            <button class="seat">C5</button>

            <div class="walkway"></div>

            <button class="seat">C6</button>
            <button class="seat">C7</button>
            <button class="seat">C8</button>
            <button class="seat">C9</button>
            <button class="seat">C10</button>
          </div>

          <div class="seat-row">
            <span class="row-name">D</span>

            <button class="seat">D1</button>
            <button class="seat">D2</button>
            <button class="seat">D3</button>
            <button class="seat">D4</button>
            <button class="seat">D5</button>

            <div class="walkway"></div>

            <button class="seat">D6</button>
            <button class="seat">D7</button>
            <button class="seat">D8</button>
            <button class="seat">D9</button>
            <button class="seat">D10</button>
          </div>

          <!-- HÀNG E -->
          <div class="seat-row">
            <span class="row-name">E</span>

            <button class="seat">E1</button>
            <button class="seat">E2</button>
            <button class="seat">E3</button>
            <button class="seat">E4</button>
            <button class="seat">E5</button>

            <div class="walkway"></div>

            <button class="seat">E6</button>
            <button class="seat">E7</button>
            <button class="seat">E8</button>
            <button class="seat">E9</button>
            <button class="seat">E10</button>
          </div>
        </div>
      </section>

      <section class="summary">
        <h4>Thông tin đặt vé</h4>

        <p>
          <b>Ngày:</b>
          <span id="selectedDate"> Chưa chọn </span>
        </p>

        <p>
          <b>Giờ chiếu:</b>
          <span id="selectedTime"> Chưa chọn </span>
        </p>

        <p>
          <b>Ghế:</b>
          <span id="selectedSeats"> Chưa chọn </span>
        </p>

        <p>
          <b>Số lượng:</b>
          <span id="seatCount">0</span>
        </p>

        <button class="btn btn-primary continue-btn" id="continueBtn">
          Tiếp tục
        </button>
      </section>
    </main>

    <script src="nghihesonghihuudatve.js"></script>
  </body>
</html>
